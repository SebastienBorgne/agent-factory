services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_RUN__DATABASE__NAME:-agent_factory}
      POSTGRES_USER: ${APP_RUN__DATABASE__USER:-agent_factory}
      POSTGRES_PASSWORD: ${APP_RUN__DATABASE__PASSWORD:-agent_factory}
    volumes:
      - agent_factory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_RUN__DATABASE__USER:-agent_factory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # One-shot: applies migrations, seeds the agent catalog, and creates the
  # admin superuser from APP_RUN__SUPERUSER__* in .env. web/worker wait for
  # this to finish successfully before starting.
  init:
    build: .
    env_file: .env
    command: sh -c "python manage.py migrate && python manage.py seed_catalog && python manage.py ensure_superuser"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started

  web:
    build: .
    restart: unless-stopped
    command: sh -c "python manage.py runserver 0.0.0.0:${APP_RUN__DJANGO_SETTINGS__PORT:-8000}"
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "${APP_RUN__DJANGO_SETTINGS__PORT:-8000}:${APP_RUN__DJANGO_SETTINGS__PORT:-8000}"
    depends_on:
      init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  worker:
    build: .
    restart: unless-stopped
    command: python worker.py
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

volumes:
  agent_factory_db_data:
