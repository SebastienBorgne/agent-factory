[project]
name = "agent-factory"
version = "0.1.0"
description = "Pick an AI agent team, describe a project, generate a self-contained OpenCode project folder."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastien Borgne", email = "sebastien.borgn@gmail.com" }]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]
extend-exclude = ["generated_teams", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "infrastructure", "config"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["test_*.py"]

[tool.mypy]
# Scoped to the hexagonal core (domain + application): pure Python, no
# Django ORM/Kafka dynamic attributes to fight, so strict typing is cheap
# and meaningful here. infrastructure/ is deliberately excluded -- getting
# Django+confluent_kafka to strict-typecheck needs django-stubs and a lot
# more stub work than this project currently warrants.
mypy_path = "src"
python_version = "3.12"
files = ["src/domain", "src/application"]
exclude = '(^|/)tests/'
strict = true
warn_unused_ignores = true

[tool.pylint.main]
load-plugins = ["pylint_django"]
django-settings-module = "config.settings"
ignore = ["migrations"]

[tool.pylint.format]
max-line-length = 110

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "_", "pk", "User"]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "duplicate-code",
    "too-many-ancestors",       # inherent to Django's Model/ModelAdmin base classes
    "consider-using-with",      # tempfile.TemporaryDirectory() + addCleanup is our test idiom
    "import-outside-toplevel",  # deliberate lazy imports to keep confluent_kafka optional
]
