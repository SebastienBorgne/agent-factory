{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agent Factory{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 960px; margin: 0 auto; padding: 24px 16px; line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
    header h1 { font-size: 1.25rem; margin: 0; }
    header a { text-decoration: none; color: inherit; }
    .card { border: 1px solid rgba(127,127,127,0.3); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .tag { display: inline-block; font-size: 0.75rem; border: 1px solid rgba(127,127,127,0.4); border-radius: 999px; padding: 2px 8px; margin: 2px 4px 2px 0; }
    .status { font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.04em; }
    .status-done, .status-succeeded { color: #1a7f37; }
    .status-blocked, .status-failed { color: #cf222e; }
    .status-in_progress, .status-running, .status-requested { color: #9a6700; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(127,127,127,0.2); font-size: 0.9rem; }
    .messages { list-style: none; padding: 0; }
    .messages li { padding: 8px 12px; border-radius: 6px; background: rgba(26,127,55,0.12); margin-bottom: 8px; }
    button, input[type=submit] { cursor: pointer; padding: 8px 14px; border-radius: 6px; border: 1px solid rgba(127,127,127,0.4); background: transparent; font-size: 0.9rem; }
    textarea, input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid rgba(127,127,127,0.4); font-family: inherit; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'builder' %}"><h1>Agent Factory</h1></a>
  </header>
  {% if messages %}
    <ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
