{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agent Factory{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%231a1a18%22/><rect x=%223%22 y=%223%22 width=%224%22 height=%224%22 fill=%22white%22/><rect x=%229%22 y=%229%22 width=%224%22 height=%224%22 fill=%22white%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="wordmark" href="{% url 'builder' %}">Agent<span>Factory</span></a>
      <nav><a href="https://github.com/SebastienBorgne/agent-factory" target="_blank" rel="noopener">GitHub</a></nav>
    </header>

    {% if messages %}
      <ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
    {% endif %}

    {% block content %}{% endblock %}

    <footer class="site-footer">
      Agent Factory — generate agentic project teams for OpenCode.
    </footer>
  </div>
</body>
</html>
